<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM chai aur code</title>
    <style>
        body{ 
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="mon day">Mon</div>
        <div class="day">Tue</div>
        <div class="day">Wed</div>
        <div class="day">Thu</div>
    </div>
</body>
<script>
    const parent = document.querySelector(".parent")
    console.log(parent)
    
    console.log(parent.children) //html collection

    console.log(parent.children[2].innerHTML)

    for(i= 0; i<parent.children.length ;i++){
        console.log(parent.children[i].innerHTML)
    }

    parent.children[2].style.color = "red"

    console.log(parent.firstElementChild.innerHTML)
    console.log(parent.lastElementChild.innerHTML)
    console.log(parent.parentElement) //shows body becacuse parent of class parent is body

    let day1 = document.querySelector(".day")
    console.log(day1.parentElement)
    console.log(day1.nextElementSibling)

    console.log(parent.childNodes) //nodelist
</script>
</html>
