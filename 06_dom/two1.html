<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM chai aur code</title>
    <style>
        body{ 
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="bg-black">
        <h1 id="title" class="heading"> DOM learning with priyanshu <span style="display: none;"> hello</span> </h1>
        <p>Lorem ipsum dolor sit amet consectetur.</p>
    </div>
</body>
<script>
    document.getElementById("title")
    console.log(document.getElementById("title").id)
    console.log(document.getElementById("title").className)
    console.log(document.getElementById("title").getAttribute("id"))
    console.log(document.getElementById('title').setAttribute("class", "heading again"))
    let title = document.getElementById("title")
    title.style.color = "red"
    console.log(title.innerHTML)
    console.log(title.innerText)
    console.log(title.textContent)

    document.getElementsByClassName('again') //gives html collection
 </script>
</html>
