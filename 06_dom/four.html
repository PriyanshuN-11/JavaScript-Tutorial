<body style="background: black; color: white;">
    <ul class="language">
        <li>js</li>
    </ul>
</body>
<script>
    function liAdder (languageName){
        const li =document.createElement("li");
        li.innerHTML = `${languageName}`
        let languageDiv =document.querySelector(".language")
        languageDiv.appendChild(li) 
    }
liAdder("pyhton")
liAdder("pyhton")
liAdder("pyhton")

function optiLanguage (languageName){
    let li = document.createElement("li")
    li.appendChild(document.createTextNode(languageName))
    document.querySelector(".language").appendChild(li)
}
optiLanguage("hello")
